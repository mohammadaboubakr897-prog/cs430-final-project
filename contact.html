<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Mohammad">
    <meta name="description" content="Contact page for Boxing Training Hub">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Boxing Training Hub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>Send a message about boxing training or website feedback.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section class="content-section">
            <h2>Contact Form</h2>

            <form id="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Submit</button>
            </form>

            <p id="form-message"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Boxing Training Hub. CS430 Final Project.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
